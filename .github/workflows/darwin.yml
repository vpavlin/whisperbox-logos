# Build WhisperBox's darwin-arm64 (Apple Silicon) packages on a GitHub macOS runner and attach them to a
# release, so they can be merged into the Linux packages (one .lgx per module, every platform inside).
#
# Runs on a push of a tag `darwin-*` (git tag darwin-0.4.2 && git push origin darwin-0.4.2), or by hand.
# The release `<tag>` gets whisperbox_core-darwin-arm64.lgx, whisperbox-darwin-arm64.lgx and the build logs.
# Basecamp ships no Intel-Mac build, so there is no darwin-amd64.
name: darwin packages

on:
  push:
    tags: ["darwin-*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            extra-substituters = https://cache.nix.logos.co/public
            extra-trusted-public-keys = public:Z1wyVBEx8PHbXujYB52Mysv9Rd8rWIhyQ3bQyef9yy4=
            accept-flake-config = true
      - name: Build
        shell: bash
        run: |
          set -u -o pipefail
          mkdir -p out logs
          ok=1
          for m in whisperbox_core:whisperbox_core whisperbox:module; do
            name=${m%%:*}; dir=${m#*:}
            if (cd "$dir" && nix build --accept-flake-config .#lgx-portable -o "$GITHUB_WORKSPACE/res-$name") > "logs/$name.log" 2>&1; then
              cp -L res-$name/*.lgx "out/$name-darwin-arm64.lgx"; echo "$name OK"
            else
              echo "$name FAILED"; tail -80 "logs/$name.log"; ok=0
            fi
          done
          [ $ok = 1 ]
      - name: Show variants
        shell: bash
        run: for f in out/*.lgx; do echo "$f"; tar -tzf "$f" | grep '^variants/[^/]*/$' || true; done
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            out/*.lgx
            logs/*.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: whisperbox-darwin-arm64
          path: |
            out/
            logs/
